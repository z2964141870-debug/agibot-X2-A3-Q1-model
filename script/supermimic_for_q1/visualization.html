<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 / MuJoCo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #202321; background: #f5f6f5; font: 15px/1.5 system-ui, sans-serif; letter-spacing: 0; }
    header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #d9dedb; background: #fff; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; }
    header span { color: #5b635f; font-size: 14px; }
    main { max-width: 1440px; margin: 0 auto; padding: 22px 24px; }
    nav { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid #cdd4cf; margin-bottom: 18px; }
    button { min-height: 44px; padding: 8px 22px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #555f59; font: inherit; cursor: pointer; }
    button[aria-selected="true"] { color: #951c36; border-bottom-color: #b92241; font-weight: 650; }
    button:hover { background: #e9edea; }
    button:focus-visible { outline: 2px solid #287c50; outline-offset: -4px; }
    video { display: block; width: 100%; aspect-ratio: 1280 / 548; background: #181b19; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-top: 14px; color: #536158; font-size: 13px; }
    @media (max-width: 600px) { header { padding: 14px 12px; } main { padding: 14px 8px; } button { padding: 8px 18px; } }
  </style>
</head>
<body>
  <header><h1>Q1</h1><span>MuJoCo / R01 / V01</span></header>
  <main>
    <nav role="tablist" aria-label="Motion">
      <button type="button" role="tab" id="walk" aria-selected="true" aria-controls="simulation" tabindex="0">Walk</button>
      <button type="button" role="tab" id="squat" aria-selected="false" aria-controls="simulation" tabindex="-1">Squat</button>
      <button type="button" role="tab" id="punch" aria-selected="false" aria-controls="simulation" tabindex="-1">Punch</button>
    </nav>
    <video id="simulation" controls autoplay muted loop playsinline preload="metadata" src="render_walk/comparison.mp4" aria-label="Reference and Q1 physics simulation"></video>
    <footer><span id="timing">33.04 s / 1,652 control steps</span><span>Free base / 50 Hz control / 1 ms physics</span></footer>
  </main>
  <script>
    const video = document.querySelector('video');
    const buttons = [...document.querySelectorAll('[role="tab"]')];
    const timing = document.getElementById('timing');
    const clips = {
      walk: ['render_walk/comparison.mp4', '33.04 s / 1,652 control steps'],
      squat: ['render_squat/comparison.mp4', '23.16 s video / 1,157 control steps'],
      punch: ['render_punch/comparison.mp4', '13.56 s / 678 control steps']
    };
    function select(button) {
      const playing = !video.paused;
      buttons.forEach(tab => {
        tab.setAttribute('aria-selected', String(tab === button));
        tab.tabIndex = tab === button ? 0 : -1;
      });
      video.autoplay = playing;
      video.src = clips[button.id][0];
      timing.textContent = clips[button.id][1];
      video.load();
      if (playing) video.play().catch(() => {});
    }
    buttons.forEach((button, index) => {
      button.addEventListener('click', () => select(button));
      button.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = buttons[(index + 1) % buttons.length];
        if (event.key === 'ArrowLeft') next = buttons[(index + buttons.length - 1) % buttons.length];
        if (event.key === 'Home') next = buttons[0];
        if (event.key === 'End') next = buttons[buttons.length - 1];
        if (next) { event.preventDefault(); next.focus(); select(next); }
      });
    });
  </script>
</body>
</html>
