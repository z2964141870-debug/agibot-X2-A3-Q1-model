<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 / BONES RF02 / MuJoCo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #202321; background: #f5f6f5; font: 15px/1.5 system-ui, sans-serif; letter-spacing: 0; }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; padding: 18px 24px; border-bottom: 1px solid #d9dedb; background: #fff; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; }
    header span { color: #5b635f; font-size: 14px; }
    main { max-width: 1440px; margin: 0 auto; padding: 22px 24px; }
    nav { display: flex; border-bottom: 1px solid #cdd4cf; margin-bottom: 18px; }
    button { min-height: 44px; padding: 8px 22px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #555f59; font: inherit; cursor: pointer; }
    button[aria-selected="true"] { color: #951c36; border-bottom-color: #b92241; font-weight: 650; }
    button:hover { background: #e9edea; }
    button:focus-visible { outline: 2px solid #287c50; outline-offset: -4px; }
    video { display: block; width: 100%; aspect-ratio: 1280 / 548; background: #181b19; }
    dl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 20px; margin: 0; padding: 18px 0; border-bottom: 1px solid #d9dedb; }
    dl div { min-width: 0; }
    dt { color: #5b635f; font-size: 13px; }
    dd { margin: 4px 0 0; font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-top: 14px; color: #536158; font-size: 13px; overflow-wrap: anywhere; }
    #clip { min-width: 0; }
    @media (max-width: 600px) { header { padding: 14px 12px; } main { padding: 14px 8px; } button { padding: 8px 18px; } dl { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header><h1>Q1</h1><span>BONES RF02 / MuJoCo</span></header>
  <main>
    <nav role="tablist" aria-label="Checkpoint">
      <button type="button" role="tab" id="initial" aria-selected="false" aria-controls="replay" tabindex="-1">Initial</button>
      <button type="button" role="tab" id="final" aria-selected="true" aria-controls="replay" tabindex="0">Final</button>
    </nav>
    <video id="replay" controls autoplay muted loop playsinline preload="metadata" src="render_final/comparison.mp4" aria-label="Q1 final policy and reference"></video>
    <dl aria-live="polite">
      <div><dt>Clip Completion</dt><dd id="completion">--</dd></div>
      <div><dt>Full-Clip Return</dt><dd id="reward">--</dd></div>
      <div><dt>Executed Joint RMSE</dt><dd id="joint">--</dd></div>
      <div><dt>Root Displacement</dt><dd id="movement">--</dd></div>
    </dl>
    <footer><span id="clip">--</span><span id="steps">--</span><span id="status" role="status">Loading</span></footer>
  </main>
  <script>
    const video = document.getElementById('replay');
    const buttons = [...document.querySelectorAll('[role="tab"]')];
    let selected = 'final';
    let pair;
    const number = (value, digits) => Number.isFinite(value) ? value.toFixed(digits) : '--';
    function updateMetrics() {
      if (!pair) return;
      const row = pair[selected];
      document.getElementById('clip').textContent = pair.clip;
      document.getElementById('completion').textContent = number(row.full_clip_completion * 100, 1) + '%';
      document.getElementById('reward').textContent = number(row.normalized_return, 4);
      document.getElementById('joint').textContent = number(row.executed_joint_rmse_rad, 4) + ' rad';
      document.getElementById('movement').textContent = number(row.root_xy_displacement_m, 3) + ' m';
      document.getElementById('steps').textContent = row.executed_steps + ' / ' + row.expected_steps + ' steps';
      document.getElementById('status').textContent = video.error ? 'Video unavailable'
        : row.early_terminated ? 'Early termination' : row.failed ? 'Terminated' : 'Completed';
    }
    function select(button) {
      if (button.id === selected) return;
      const playing = !video.paused;
      selected = button.id;
      buttons.forEach(tab => {
        tab.setAttribute('aria-selected', String(tab === button));
        tab.tabIndex = tab === button ? 0 : -1;
      });
      video.src = 'render_' + selected + '/comparison.mp4';
      video.setAttribute('aria-label', 'Q1 ' + selected + ' policy and reference');
      video.autoplay = playing;
      video.load();
      if (playing) video.play().catch(() => {});
      updateMetrics();
    }
    buttons.forEach((button, index) => {
      button.addEventListener('click', () => select(button));
      button.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = buttons[(index + 1) % buttons.length];
        if (event.key === 'ArrowLeft') next = buttons[(index + buttons.length - 1) % buttons.length];
        if (event.key === 'Home') next = buttons[0];
        if (event.key === 'End') next = buttons[buttons.length - 1];
        if (next) { event.preventDefault(); next.focus(); select(next); }
      });
    });
    video.addEventListener('error', () => { document.getElementById('status').textContent = 'Video unavailable'; });
    fetch('comparison.json').then(response => {
      if (!response.ok) throw new Error('Comparison unavailable');
      return response.json();
    }).then(comparison => {
      if (comparison.status !== 'MATCHED_PHYSICS_COMPARISON_COMPLETED' || !comparison.pairs.length) {
        throw new Error('Comparison unavailable');
      }
      pair = comparison.pairs[0];
      updateMetrics();
    }).catch(() => { document.getElementById('status').textContent = 'Comparison unavailable'; });
  </script>
</body>
</html>
